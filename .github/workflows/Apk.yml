name: Build apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Xmx8g -XX:MaxMetaspaceSize=2g"
      JAVA_TOOL_OPTIONS: "-Xmx8g -XX:MaxMetaspaceSize=2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Remove Android Folder
        run: rm -rf android

      - name: Generate Android Project
        run: npx expo prebuild --platform android --non-interactive

      - name: Increase Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Clean Project
        run: |
          cd android
          ./gradlew clean --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
