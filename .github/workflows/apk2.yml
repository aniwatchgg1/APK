name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Xmx8g -XX:MaxMetaspaceSize=2g"
      JAVA_TOOL_OPTIONS: "-Xmx8g -XX:MaxMetaspaceSize=2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Dependencies
        run: npm install

      - name: Expo Doctor
        run: npx expo-doctor || true

      - name: Find MMKV
        run: npm ls react-native-mmkv || true

      - name: Install Expo Compatible Packages
        run: npx expo install --fix

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Patch Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --warning-mode all --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release1.apk
